# Configuration du relais Cloudflare Worker (déployé avec `npx wrangler deploy`)
name = "radar-relais"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites autorisés à appeler le relais (séparés par des virgules). Toute autre origine reçoit
# une erreur 403. Pour tester le site en local, ajouter temporairement ",http://localhost:8000"
# puis `npx wrangler deploy` (et le retirer ensuite).
ORIGINES = "https://wazyrix.github.io"
# Adresse du site (liens dans les notifications, fichier data/adn.json)
SITE = "https://wazyrix.github.io/radar/"
# Projet Supabase (comptes et potes) : adresse publique
SUPABASE_URL = "https://ryinzwuccealzsyakjya.supabase.co"
# Clé PUBLIQUE de Supabase (la même que dans js/config.js) : lecture quotidienne anti-pause (src/eveil.js)
SUPABASE_CLE_PUBLIQUE = "sb_publishable_aqfdeizQQUf6zarzvUmqOQ_vrab9K4g"
# Dépôt et workflow lancés par la tâche horaire (collecte des actus, src/github.js)
GITHUB_DEPOT = "wazyrix/radar"
GITHUB_WORKFLOW = "actus.yml"
# Clé PUBLIQUE des notifications web (la privée est un secret : VAPID_PRIVE)
VAPID_PUBLIQUE = "BDrLw-_L5jBFYKGCjkjlkYauEpjkMgeKQrpZaL6BWc4qSy9_IA0_xdne3lNqJ9loIql-pyrFIqGg3ZKMkM9QN0k"

# Limite de débit par adresse IP : un Durable Object par adresse (src/limiteur.js).
# Gratuit (offre Free : objets "SQLite"), compteurs en mémoire, aucune écriture KV.
[[durable_objects.bindings]]
name = "LIMITEUR"
class_name = "Limiteur"

# Données du relais (listes, abonnements aux notifs, état des vérifications, cloche) :
# un Durable Object SQLite (gratuit : 100 000 lignes écrites par jour, contre 1000 écritures pour KV)
[[durable_objects.bindings]]
name = "STOCKAGE"
class_name = "Stockage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiteur"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stockage"]

# Journaux (Workers Logs) : historique visible dans le tableau de bord Cloudflare
# (Workers → radar-relais → Logs) : anti-pause Supabase, lancement du workflow, vérification, erreurs.
# Inclus dans l'offre gratuite : 200 000 événements par jour, gardés 3 jours.
[observability]
enabled = true
head_sampling_rate = 1

# Toutes les heures (à la 5e minute) : vérification des nouveautés + lancement de la collecte des actus
# (+ à 4 h 05 UTC : lecture Supabase anti-pause)
[triggers]
crons = ["5 * * * *"]

# Secrets (jamais dans ce fichier), définis avec `npx wrangler secret put NOM` :
#   RAWG_KEY     clé API RAWG (jeux)
#   TMDB_KEY     clé API TMDB (films et séries)
#   VAPID_PRIVE  clé privée des notifications web (JWK)
#   SUPABASE_SERVICE  clé "service_role" de Supabase (droits complets : ne jamais la mettre dans le site)
#   GITHUB_TOKEN jeton fine-grained limité au dépôt radar, permission « Actions : lecture et écriture »
