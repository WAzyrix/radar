# Collecte les actus toutes les heures, enregistre les JSON dans le repo,
# puis publie le site sur GitHub Pages.
name: Actus et déploiement

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la 17e minute (moins d'embouteillage qu'à pile)
  push:
    branches: [main]       # à chaque push : on republie le site
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write          # pour commiter les JSON
  pages: write             # pour publier sur GitHub Pages
  id-token: write

# Un seul déploiement à la fois (le suivant attend la fin du précédent)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collecte-et-publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Le script n'utilise que la bibliothèque standard : rien à installer
      - name: Collecter les actus
        run: python3 scripts/collecte.py

      # Si ADN est en panne, on garde l'ancien fichier et on continue
      - name: Collecter les sorties ADN (VOSTFR/VF)
        run: python3 scripts/collecte_adn.py
        continue-on-error: true

      # Si un autre run a poussé entre-temps, le rebase peut buter sur data/*.json :
      # "-X theirs" garde NOS fichiers (les plus récents, en cours de rebase).
      # Trois essais ; si le push échoue quand même, le site est publié malgré tout.
      - name: Enregistrer les JSON s'ils ont changé
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Pas de nouvelles actus."
            exit 0
          fi
          git commit -m "Actus : mise à jour automatique"
          for essai in 1 2 3; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            echo "Push refusé (essai $essai), nouvel essai dans 10 s…"
            sleep 10
          done
          echo "::warning::Actus non enregistrées dans le dépôt (le site est quand même publié)."

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
